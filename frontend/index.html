<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Garmin Coach</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a22;
      --border: #262b36;
      --text: #e6e8eb;
      --muted: #98a2b3;
      --accent: #4f8cff;
      --success: #1f8a4c;
      --error: #b53b3b;
      --danger: #b53b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 0.9rem; }
    main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    section { margin-bottom: 2.5rem; }
    section h2 {
      margin: 0 0 1rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .toolbar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    button, .btn {
      background: var(--accent);
      color: white;
      border: 0;
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-small { padding: 0.35rem 0.7rem; font-size: 0.85rem; }
    .btn-danger { background: var(--danger); }
    button:disabled { opacity: 0.6; cursor: progress; }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    select, input[type="text"], input[type="date"], textarea {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    input[type="text"], input[type="date"] { min-width: 130px; }
    label { color: var(--muted); font-size: 0.9rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      min-height: 120px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td {
      padding: 0.55rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    .empty { color: var(--muted); padding: 1.5rem; text-align: center; }
    .banner {
      padding: 0.7rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }
    .banner.success { background: rgba(31,138,76,0.15); color: #7ad9a4; border: 1px solid rgba(31,138,76,0.35); }
    .banner.error   { background: rgba(181,59,59,0.15);  color: #ff9a9a; border: 1px solid rgba(181,59,59,0.35); }
    .htmx-request button { opacity: 0.6; cursor: progress; }

    /* Goals */
    .goal-form {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 1rem;
    }
    .goal-form .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .goal-form .field label { font-size: 0.78rem; }
    .goal-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .goal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7rem 1rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .goal-meta { color: var(--muted); font-size: 0.85rem; margin-left: 0.4rem; }
    .goal-notes { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }

    /* Chat */
    #chat-history { max-height: 480px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.7rem; }
    .msg { padding: 0.7rem 0.9rem; border-radius: 8px; line-height: 1.5; }
    .msg-role { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.3rem; }
    .msg-body { font-size: 0.95rem; }
    .msg-user { background: rgba(79,140,255,0.08); border: 1px solid rgba(79,140,255,0.25); align-self: flex-end; max-width: 80%; }
    .msg-assistant { background: rgba(255,255,255,0.03); border: 1px solid var(--border); align-self: flex-start; max-width: 90%; }
    .chat-form { display: flex; gap: 0.6rem; margin-top: 0.8rem; align-items: flex-end; }
    .chat-form textarea {
      flex: 1; min-height: 60px; resize: vertical;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0.6rem; font-size: 0.95rem; font-family: inherit;
    }
    .thinking-indicator { color: var(--muted); font-style: italic; padding: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Garmin Coach</h1>
    <span class="sub">local · running · v0.1</span>
  </header>

  <main>
    <section>
      <h2>Activities</h2>
      <div class="toolbar">
        <button hx-post="/sync" hx-target="#activities-panel" hx-include="[name='days']" hx-indicator="this">
          Sync from Garmin
        </button>
        <label for="days">Last</label>
        <select name="days" id="days" hx-get="/activities" hx-target="#activities-panel" hx-trigger="change">
          <option value="7">7 days</option>
          <option value="30" selected>30 days</option>
          <option value="90">90 days</option>
          <option value="365">365 days</option>
        </select>
        <form hx-post="/import/csv"
              hx-target="#activities-panel"
              hx-encoding="multipart/form-data"
              style="display: inline-flex; gap: 0.5rem; align-items: center;">
          <label for="csv-file" style="cursor: pointer; padding: 0.4rem 0.7rem; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
            Choose CSV…
          </label>
          <input id="csv-file" type="file" name="file" accept=".csv" required style="display: none;"
                 onchange="this.form.querySelector('button').disabled = !this.files.length; document.getElementById('csv-filename').textContent = this.files[0] ? this.files[0].name : '';">
          <span id="csv-filename" style="color: var(--muted); font-size: 0.85rem;"></span>
          <button type="submit" disabled>Import</button>
        </form>
      </div>
      <div id="activities-panel"
           class="panel"
           hx-get="/activities?days=30"
           hx-trigger="load">
        <div class="empty">Loading…</div>
      </div>
    </section>

    <section>
      <h2>Goals</h2>
      <form class="goal-form"
            hx-post="/goals"
            hx-target="#goals-panel"
            hx-on::after-request="this.reset()">
        <div class="field">
          <label for="distance">Distance</label>
          <select name="distance" id="distance" required>
            <option value="5k">5K</option>
            <option value="10k">10K</option>
            <option value="half_marathon">Half marathon</option>
            <option value="marathon">Marathon</option>
          </select>
        </div>
        <div class="field">
          <label for="target_time">Target time</label>
          <input type="text" name="target_time" id="target_time" placeholder="e.g. 24:30 or 1:45:00" />
        </div>
        <div class="field">
          <label for="target_date">Target date (optional)</label>
          <input type="date" name="target_date" id="target_date" />
        </div>
        <div class="field" style="flex: 1; min-width: 200px;">
          <label for="notes">Notes (optional)</label>
          <input type="text" name="notes" id="notes" placeholder="e.g. spring race in Athens" />
        </div>
        <button type="submit">Add goal</button>
      </form>
      <div id="goals-panel"
           class="panel"
           hx-get="/goals"
           hx-trigger="load">
        <div class="empty">Loading…</div>
      </div>
    </section>

    <section>
      <h2>Coach</h2>
      <div id="chat-history"
           class="panel"
           hx-get="/chat/history"
           hx-trigger="load">
        <div class="empty">Loading…</div>
      </div>
      <form class="chat-form"
            hx-post="/chat"
            hx-target="#chat-history"
            hx-swap="beforeend scroll:bottom"
            hx-disabled-elt="find button, find textarea"
            hx-on::after-request="this.reset(); document.getElementById('chat-history').scrollTop = document.getElementById('chat-history').scrollHeight;">
        <textarea name="message" placeholder="Ask the coach about your training, or request a weekly plan..." required></textarea>
        <button type="submit">Send</button>
      </form>
      <div style="margin-top: 0.5rem;">
        <button class="btn-small btn-danger"
                hx-post="/chat/clear"
                hx-target="#chat-history"
                hx-confirm="Clear all chat history?">Clear chat</button>
      </div>
    </section>
  </main>
</body>
</html>
